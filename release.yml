name: Build Foundry Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Foundry module zip
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          zip -r "danger-room-v${VERSION}.zip" module.json README.md CHANGELOG.md LICENSE scripts styles

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: danger-room-v*.zip
          generate_release_notes: true
